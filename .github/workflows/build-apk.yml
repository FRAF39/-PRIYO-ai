
name: Build PRIYO_CODEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: priyo-codex-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Verify Android SDK
        run: |
          echo "Android SDK setup completed."
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            DIR=$(find . -name settings.gradle.kts \
              -not -path './.git/*' \
              -not -path './extracted/*' \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Validate project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f scripts/prepare-native.sh
          test -f scripts/download-model.sh
          test -f app/src/main/cpp/CMakeLists.txt

      - name: Prepare llama.cpp
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x scripts/prepare-native.sh
          bash scripts/prepare-native.sh

      - name: Download GGUF model
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x scripts/download-model.sh
          bash scripts/download-model.sh

          MODEL="app/src/main/assets/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"

          if [ ! -s "$MODEL" ]; then
            echo "GGUF model missing or empty!"
            exit 1
          fi

          ls -lh "$MODEL"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO_CODEX-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
