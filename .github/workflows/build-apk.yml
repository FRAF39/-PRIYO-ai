name: Build PRIYO_CODEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: priyo-codex-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK tools and accept licenses
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      # 4. Explicitly accept all available SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses
          echo "Android SDK licenses processed."

      # 5. Install required Android SDK packages
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # 6. Check Android tools
      - name: Verify Android toolchain
        shell: bash
        run: |
          java -version
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      # 7. Install Gradle
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 8. Find project directory
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="$(find . \
              -path './.git' -prune -o \
              -path './extracted' -prune -o \
              -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      # 9. Check required project files
      - name: Validate project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          test -f scripts/prepare-native.sh
          test -f scripts/download-model.sh
          echo "Required project files found."

      # 10. Prepare llama.cpp
      - name: Download llama.cpp source
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x scripts/prepare-native.sh
          bash scripts/prepare-native.sh

          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt
          echo "llama.cpp source is ready."

      # 11. Download the GGUF model
      - name: Download Qwen GGUF model
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x scripts/download-model.sh
          bash scripts/download-model.sh

          MODEL="app/src/main/assets/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"

          if [ ! -s "$MODEL" ]; then
            echo "ERROR: GGUF model download failed."
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")
          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: Model file is unexpectedly small."
            exit 1
          fi

      # 12. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      # 13. Check APK output
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK build completed."

      # 14. Upload APK to GitHub Actions
      - name: Upload PRIYO_CODEX APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO_CODEX-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
