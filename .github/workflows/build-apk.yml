name: Build PRIYO_CODEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.cpp'
      - '**.txt'
      - '**.sh'
      - '**.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle.kts \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Download llama.cpp source
        working-directory: ${{ steps.project.outputs.dir }}
        run: bash scripts/prepare-native.sh

      - name: Download GGUF model
        working-directory: ${{ steps.project.outputs.dir }}
        run: bash scripts/download-model.sh

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO_CODEX-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
