
name: Build PRIYO_CODEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: priyo-codex-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Android SDK and accept licenses automatically
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      # Install every SDK package separately
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;27.2.12479018"

          echo "All Android SDK packages installed."

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK verification successful."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            DIR="."
          else
            DIR=$(find . \
              -path './.git' -prune -o \
              -path './extracted' -prune -o \
              -name settings.gradle.kts \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Validate project files
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f scripts/prepare-native.sh
          test -f scripts/download-model.sh
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Project files verified."

      - name: Prepare llama.cpp
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x scripts/prepare-native.sh
          bash scripts/prepare-native.sh

      - name: Download GGUF model
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x scripts/download-model.sh
          bash scripts/download-model.sh

          MODEL="app/src/main/assets/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"

          if [ ! -s "$MODEL" ]; then
            echo "ERROR: GGUF model is missing."
            exit 1
          fi

          ls -lh "$MODEL"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO_CODEX-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
