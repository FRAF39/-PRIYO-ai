
name: Extract ZIP to Repository Root

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP directly into root
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()

          archives = [
              p for p in root.rglob("*.zip")
              if ".git" not in p.parts
          ]

          if not archives:
              print("No ZIP files found.")
              raise SystemExit(0)

          for archive in archives:
              print(f"Processing: {archive.name}")

              with zipfile.ZipFile(archive) as z:
                  entries = []

                  for info in z.infolist():
                      name = info.filename.replace("\\", "/")
                      path = PurePosixPath(name)

                      if path.is_absolute() or ".." in path.parts:
                          raise RuntimeError(f"Unsafe ZIP path: {name}")

                      if not path.parts or path.parts[0] == ".git":
                          continue

                      entries.append((info, path))

                  # Remove a common wrapper folder if present
                  first_parts = {
                      path.parts[0] for _, path in entries
                      if path.parts
                  }

                  strip_folder = None

                  if len(first_parts) == 1:
                      candidate = next(iter(first_parts))
                      if all(
                          len(path.parts) > 1
                          for _, path in entries
                          if path.parts
                      ):
                          strip_folder = candidate

                  for info, path in entries:
                      parts = path.parts

                      if strip_folder:
                          parts = parts[1:]

                      if not parts:
                          continue

                      target = root.joinpath(*parts).resolve()

                      if not target.is_relative_to(root.resolve()):
                          raise RuntimeError(f"Unsafe target: {target}")

                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(
                              parents=True, exist_ok=True
                          )
                          with z.open(info) as source:
                              with open(target, "wb") as destination:
                                  destination.write(source.read())

              # Delete ZIP after successful extraction
              archive.unlink()
              print(f"Deleted ZIP: {archive.name}")

          PY

      - name: Commit extracted files and delete ZIPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract ZIP files into repository root" || echo "Nothing to commit"
          git push
          
